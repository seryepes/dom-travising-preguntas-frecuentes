<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preguntas Frecuentes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="contenedor">
        <h1>Gestor De Pregutas Frecuentes</h1>

        <form id="formulario-faq">
            <input type="text" name="" id="input-pregunta" 
                placeholder="Escribe la pregunta" required>
            <textarea  id="input-respuesta" 
                placeholder="Escribe la respuesta..." required></textarea>

            <button type="submit" id="btn-agregar">Agregar Pregunta</button>
        </form>


        <section id="lista-faq" class="lista-faq"></section>
    </main>

    <footer>
        <p>Proyecto CRUD Preguntas Frecuentes</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
